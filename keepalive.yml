# Opcional: evita que tu proyecto gratuito de Supabase se pause por falta de uso.
# Se crea en GitHub: tu repositorio -> Add file -> Create new file -> en el nombre escribe:
#     .github/workflows/keepalive.yml
# Pega este texto, cambia TU-PROYECTO y TU_LLAVE_ANON por tus datos, y pulsa Commit.
name: keepalive
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar Supabase
        run: |
          curl -s -o /dev/null -w "respuesta: %{http_code}\n" "https://TU-PROYECTO.supabase.co/rest/v1/profiles?select=user_id&limit=1" -H "apikey: TU_LLAVE_ANON"
